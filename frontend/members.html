<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members - XiiMody Gym Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        <span>💪</span> XiiMody<span>Gym</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="members.html" class="active">Members</a></li>
        <li><a href="classes.html">Classes</a></li>
        <li><a href="plans.html">Plans</a></li>
        <li><a href="trainers.html">Trainers</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Members Management</h1>
      <button class="btn btn-primary" onclick="openAddMemberModal()">+ Add Member</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search members by name or email...">
    </div>

    <!-- Members Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Membership Plan</th>
            <th>Join Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="membersTableBody">
          <tr>
            <td colspan="8" style="text-align: center;">
              <div class="loading-spinner">Loading members...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Member Modal -->
  <div class="modal" id="memberModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Member</h2>
        <button class="close-modal" onclick="closeMemberModal()">&times;</button>
      </div>
      <form id="memberForm" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="memberId">
        
        <div class="form-group">
          <label class="form-label">Name *</label>
          <input type="text" class="form-input" id="memberName" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" class="form-input" id="memberEmail" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="tel" class="form-input" id="memberPhone" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Membership Plan *</label>
          <select class="form-select" id="memberPlan" required>
            <option value="">Select a plan</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="memberStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeMemberModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Member</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
