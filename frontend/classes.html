<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes - XiiMody Gym Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        <span>💪</span> XiiMody<span>Gym</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="members.html">Members</a></li>
        <li><a href="classes.html" class="active">Classes</a></li>
        <li><a href="plans.html">Plans</a></li>
        <li><a href="trainers.html">Trainers</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Class Schedule</h1>
      <button class="btn btn-primary" onclick="openAddClassModal()">+ Add Class</button>
    </div>

    <!-- Classes Grid -->
    <div class="grid" id="classesGrid">
      <div class="loading-spinner">Loading classes...</div>
    </div>
  </div>

  <!-- Add/Edit Class Modal -->
  <div class="modal" id="classModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Class</h2>
        <button class="close-modal" onclick="closeClassModal()">&times;</button>
      </div>
      <form id="classForm" onsubmit="handleClassSubmit(event)">
        <input type="hidden" id="classId">
        
        <div class="form-group">
          <label class="form-label">Class Name *</label>
          <input type="text" class="form-input" id="className" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Trainer *</label>
          <select class="form-select" id="classTrainer" required>
            <option value="">Select a trainer</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Time *</label>
          <input type="text" class="form-input" id="classTime" placeholder="e.g., 07:00 AM" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Duration *</label>
          <input type="text" class="form-input" id="classDuration" placeholder="e.g., 60 min" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Capacity *</label>
          <input type="number" class="form-input" id="classCapacity" min="1" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Days of Week</label>
          <div style="display: flex; flex-wrap: wrap; gap: 1rem;">
            <label><input type="checkbox" name="days" value="Monday"> Monday</label>
            <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
            <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
            <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
            <label><input type="checkbox" name="days" value="Friday"> Friday</label>
            <label><input type="checkbox" name="days" value="Saturday"> Saturday</label>
            <label><input type="checkbox" name="days" value="Sunday"> Sunday</label>
          </div>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeClassModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Class</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/classes.js"></script>
</body>
</html>
